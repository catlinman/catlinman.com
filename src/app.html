<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/img/head/apple-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#181818" />
		<meta name="description" content="Catlinman was the handle of an artist, animator and programmer, and generally speaking a professional button presser. Retired in 2020." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Catlinman" />
		<meta property="og:url" content="https://catlinman.com" />
		<meta property="og:image" content="https://catlinman.com/img/head/meta.jpg" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:site" content="@catllnman" />
		%sveltekit.head%
		<script>
			// Content panels fade in on scroll, unless the visitor asked for less motion
			if (!matchMedia('(prefers-reduced-motion: reduce)').matches)
				document.documentElement.classList.add('reveal')
		</script>
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
